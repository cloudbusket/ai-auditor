name: CloudBusket AI Auditor CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auditor-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build auditor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache: true
          cache-dependency-path: audit-engine/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify Go formatting
        working-directory: audit-engine
        shell: bash
        run: |
          files="$(gofmt -l $(find . -type f -name '*.go'))"
          if [[ -n "$files" ]]; then
            echo "The following Go files need formatting:"
            echo "$files"
            exit 1
          fi
          echo "Go formatting check passed."

      - name: Download dependencies
        working-directory: audit-engine
        run: go mod download

      - name: Run Go tests
        working-directory: audit-engine
        run: go test -count=1 ./...

      - name: Run Go race detector
        working-directory: audit-engine
        run: go test -race -count=1 ./...

      - name: Run Go vet
        working-directory: audit-engine
        run: go vet ./...

      - name: Extract dashboard JavaScript
        working-directory: audit-engine
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path("internal/dashboard/server.go").read_text()
          scripts = re.findall(
              r"<script>(.*?)</script>",
              source,
              flags=re.DOTALL,
          )

          if len(scripts) != 1:
              raise SystemExit(
                  f"Expected one embedded script, found {len(scripts)}"
              )

          Path("/tmp/cloudbusket-dashboard.js").write_text(scripts[0])
          print("Dashboard JavaScript extracted successfully.")
          PY

      - name: Validate dashboard JavaScript
        run: node --check /tmp/cloudbusket-dashboard.js

      - name: Build Linux auditor
        working-directory: audit-engine
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath \
            -ldflags="-s -w" \
            -o dist/auditor .

      - name: Verify Linux binary
        working-directory: audit-engine
        run: |
          file dist/auditor
          test -x dist/auditor

      - name: Upload Linux build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudbusket-auditor-linux-amd64
          path: audit-engine/dist/auditor
          if-no-files-found: error
          retention-days: 14
